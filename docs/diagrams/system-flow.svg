<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-label="NOESIS System Flow">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .step { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; }
      .label { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .decision { fill: #fffbeb; stroke: #b45309; stroke-width: 2.5; }
      .line { stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .yesno { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="700" y="55" text-anchor="middle" class="title">NOESIS System Flow (Pre-Trade to Post-Trade)</text>

  <rect class="step" x="160" y="110" width="1080" height="90"/>
  <text x="700" y="148" text-anchor="middle" class="label">1. User Creates Trade Plan</text>
  <text x="700" y="174" text-anchor="middle" class="small">Symbol, quantity, product type, stop loss, target, rationale</text>

  <rect class="step" x="160" y="250" width="1080" height="100"/>
  <text x="700" y="290" text-anchor="middle" class="label">2. Pre-Trade Intelligence API Evaluation</text>
  <text x="700" y="316" text-anchor="middle" class="small">Risk rules + behavioral checks + market context -> decision token (HMAC + TTL)</text>

  <polygon class="decision" points="700,410 860,500 700,590 540,500"/>
  <text x="700" y="495" text-anchor="middle" class="label">Token Valid?</text>
  <text x="700" y="520" text-anchor="middle" class="small">Risk + Policy + Time Window</text>

  <rect class="step" x="160" y="650" width="1080" height="100"/>
  <text x="700" y="690" text-anchor="middle" class="label">3. Execute Trade Request</text>
  <text x="700" y="716" text-anchor="middle" class="small">Idempotency key, market clock check, trusted quote fetch, MongoDB transaction commit</text>

  <rect class="step" x="160" y="800" width="1080" height="100"/>
  <text x="700" y="840" text-anchor="middle" class="label">4. Post-Trade Processing</text>
  <text x="700" y="866" text-anchor="middle" class="small">Outbox events, reflections, journaling outcomes, discipline analytics, weekly reports</text>

  <rect class="step" x="980" y="430" width="260" height="95"/>
  <text x="1110" y="468" text-anchor="middle" class="label">Reject / Retry</text>
  <text x="1110" y="494" text-anchor="middle" class="small">Return reason code</text>

  <line class="line" x1="700" y1="200" x2="700" y2="250"/>
  <line class="line" x1="700" y1="350" x2="700" y2="410"/>
  <line class="line" x1="700" y1="590" x2="700" y2="650"/>
  <line class="line" x1="700" y1="750" x2="700" y2="800"/>
  <line class="line" x1="860" y1="500" x2="980" y2="478"/>

  <text x="730" y="620" class="yesno">YES</text>
  <text x="900" y="475" class="yesno">NO</text>

  <text x="160" y="955" class="small">Safety gates: stale data blocked, payload hash validation, strict rate limits, and audit trace IDs for all decisions.</text>
</svg>
