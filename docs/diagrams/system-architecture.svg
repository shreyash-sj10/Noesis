<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="NOESIS System Architecture">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 19px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .data { fill: #ecfeff; stroke: #0f766e; stroke-width: 2; rx: 12; }
      .ext { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .edge { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="700" y="55" text-anchor="middle" class="title">NOESIS System Architecture</text>

  <rect class="box" x="70" y="120" width="190" height="90"/>
  <text x="165" y="158" text-anchor="middle" class="label">Trader</text>
  <text x="165" y="184" text-anchor="middle" class="small">Web/Mobile Browser</text>

  <rect class="box" x="330" y="120" width="260" height="90"/>
  <text x="460" y="158" text-anchor="middle" class="label">Frontend SPA</text>
  <text x="460" y="184" text-anchor="middle" class="small">React + Vite (Port 5180)</text>

  <rect class="box" x="660" y="120" width="250" height="90"/>
  <text x="785" y="158" text-anchor="middle" class="label">Edge / Proxy</text>
  <text x="785" y="184" text-anchor="middle" class="small">TLS + WS Upgrade</text>

  <rect class="box" x="980" y="95" width="320" height="150"/>
  <text x="1140" y="135" text-anchor="middle" class="label">Backend API</text>
  <text x="1140" y="161" text-anchor="middle" class="small">Express + Auth + Validation</text>
  <text x="1140" y="186" text-anchor="middle" class="small">Trade Service + Intelligence</text>
  <text x="1140" y="211" text-anchor="middle" class="small">Live Quote WebSocket</text>

  <rect class="data" x="980" y="320" width="210" height="110"/>
  <text x="1085" y="365" text-anchor="middle" class="label">MongoDB</text>
  <text x="1085" y="391" text-anchor="middle" class="small">Replica Set</text>

  <rect class="data" x="1220" y="320" width="140" height="110"/>
  <text x="1290" y="365" text-anchor="middle" class="label">Redis</text>
  <text x="1290" y="391" text-anchor="middle" class="small">Optional</text>

  <rect class="box" x="980" y="490" width="380" height="120"/>
  <text x="1170" y="532" text-anchor="middle" class="label">Background Workers</text>
  <text x="1170" y="558" text-anchor="middle" class="small">Outbox, Stop/Target Monitor, Square-Off</text>
  <text x="1170" y="582" text-anchor="middle" class="small">Calendar Sync, Order Sweep, Executors</text>

  <rect class="ext" x="140" y="660" width="1120" height="160"/>
  <text x="700" y="700" text-anchor="middle" class="label">External Market & AI Services</text>

  <rect class="ext" x="190" y="725" width="220" height="70"/>
  <text x="300" y="768" text-anchor="middle" class="small">Yahoo Finance</text>

  <rect class="ext" x="450" y="725" width="180" height="70"/>
  <text x="540" y="768" text-anchor="middle" class="small">Finnhub (Optional)</text>

  <rect class="ext" x="670" y="725" width="180" height="70"/>
  <text x="760" y="768" text-anchor="middle" class="small">Gemini (Optional)</text>

  <rect class="ext" x="890" y="725" width="280" height="70"/>
  <text x="1030" y="768" text-anchor="middle" class="small">Trading Calendar Service</text>

  <line class="edge" x1="260" y1="165" x2="330" y2="165"/>
  <line class="edge" x1="590" y1="165" x2="660" y2="165"/>
  <line class="edge" x1="910" y1="165" x2="980" y2="165"/>
  <line class="edge" x1="1085" y1="245" x2="1085" y2="320"/>
  <line class="edge" x1="1220" y1="245" x2="1290" y2="320"/>
  <line class="edge" x1="1140" y1="245" x2="1170" y2="490"/>
  <line class="edge" x1="1170" y1="610" x2="1170" y2="660"/>

  <text x="70" y="875" class="small">Note: Redis is optional for correctness; MongoDB replica set is required for transactional safety.</text>
</svg>
